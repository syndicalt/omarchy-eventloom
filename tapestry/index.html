<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventloom Tapestry</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box }
  body {
    margin: 0; overflow: hidden;
    background: #120e0b;
    color: #f3ead8;
    font: 13px "Palatino Linotype", Palatino, Georgia, serif;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab }
  canvas:active { cursor: grabbing }
  header { position: fixed; z-index: 2; top: 18px; left: 0; right: 0; text-align: center; pointer-events: none }
  h1 { font: 28px "Palatino Linotype", Palatino, Georgia, serif; font-weight: 500; letter-spacing: .08em; margin: 0 0 2px; color: #f6ecd9 }
  header p { margin: 0; color: #f0e2cc; letter-spacing: .12em; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace }
  #hint { position: fixed; right: 32px; top: 28px; color: #f0e2cc; letter-spacing: .04em; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace }
  #panel {
    position: fixed; right: 28px; top: 118px; width: min(340px, calc(100vw - 56px));
    padding: 18px 18px 16px; border-radius: 2px 10px 10px 2px;
    background: rgba(246, 236, 216, .96); color: #3a2c1e;
    border: 1px solid #8d7350; border-left: 5px solid #6b4c7a;
    box-shadow: 0 18px 40px rgba(0,0,0,.35);
    transform: translateX(calc(100% + 40px)); transition: transform .2s ease;
  }
  #panel.show { transform: none }
  #panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; color: #2c2116 }
  #panel p { color: #5c4b38; line-height: 1.55; margin: 5px 0 }
  #panel b { color: #2c2116 }
  #panel code { color: #7a6248; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace }
  #empty {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #4a3b2a; font: 20px "Palatino Linotype", Palatino, Georgia, serif;
    pointer-events: none; text-align: center;
  }
  #empty small { display: block; margin-top: 8px; font: 10px ui-monospace, monospace; color: #7d6a52; letter-spacing: .08em }
</style>
<header><h1>Tapestry</h1><p>SESSIONS GROW UPWARD FROM THEIR START</p></header>
<div id="hint">drag to pan · wheel to zoom · select a session</div>
<canvas id="cloth"></canvas>
<div id="empty" hidden>Nothing woven yet.<small>Start an agent session, then reload this read-only view.</small></div>
<aside id="panel"></aside>
<script type="module" src="/weave.js"></script>
</html>
